name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install upx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl
          sudo ln -sf "$(command -v upx-ucl || command -v upx)" /usr/local/bin/upx
      - name: Package
        run: bash scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz --generate-notes --title "caochuan ${GITHUB_REF_NAME}"
