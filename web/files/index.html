<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>草船 · 转发面板</title>
<style>
:root{--bg:#0f1720;--card:#182230;--line:#263444;--fg:#d7e0ea;--dim:#7c8b9c;--acc:#4da3ff;--ok:#3fb96f;--bad:#e0564f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
button{cursor:pointer;border:1px solid var(--line);background:#1f2c3b;color:var(--fg);border-radius:6px;padding:5px 12px}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc);border-color:var(--acc);color:#08131f;font-weight:600}
button.danger{color:var(--bad)}button.mini{padding:2px 8px;font-size:12px}
input,select,textarea{background:#0d141c;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 9px;font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:12px}tr:hover td{background:#1a2530}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.badge.on{background:#123524;color:var(--ok)}.badge.off{background:#3a2020;color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
#login{display:flex;min-height:100vh;align-items:center;justify-content:center}
#login[hidden]{display:none} /* author 规则会压过 UA 的 [hidden]，必须显式关掉 */
#login .card{width:320px;text-align:center}#login h1{margin:0 0 4px;font-size:22px}#login p{color:var(--dim);margin:0 0 16px}
#login input{width:100%;margin-bottom:10px}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0}.chip{color:var(--dim);font-size:12px}.chip b{color:var(--fg);font-weight:600}
header .sp{flex:1}
nav{display:flex;gap:4px;padding:8px 20px;border-bottom:1px solid var(--line)}
nav button{border:none;background:none;border-radius:0;padding:6px 14px;color:var(--dim)}
nav button.act{color:var(--acc);border-bottom:2px solid var(--acc)}
main{padding:16px 24px;max-width:1680px;margin:0 auto}
th{white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.muted{color:var(--dim)}.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.col-rate{min-width:190px}
.col-total{min-width:150px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:18px;width:380px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 12px}dialog label{display:block;margin:10px 0 4px;font-size:12px;color:var(--dim)}
dialog input,dialog select{width:100%}
dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#logpre{background:#0a1017;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:60vh;overflow:auto;font:12px/1.6 Consolas,monospace;white-space:pre-wrap}
.hint{font-size:12px;color:var(--dim)}
td .tok{font-family:Consolas,monospace;font-size:12px}
tr.grp td{background:#141e29;color:var(--acc);font-weight:600;font-size:12px;letter-spacing:.5px}
.note{color:var(--bad);font-size:12px}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="card">
    <h1>草船</h1><p>TCP/UDP 转发与内网穿透</p>
    <input id="pw" type="password" placeholder="面板密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="pri" style="width:100%" onclick="doLogin()">登 录</button>
    <p id="loginErr" style="color:var(--bad);margin:10px 0 0;min-height:1em"></p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <h1>🚣 草船</h1>
    <span class="chip">运行 <b id="ov-uptime">-</b></span>
    <span class="chip">客户端 <b id="ov-clients">-</b></span>
    <span class="chip">规则 <b id="ov-rules">-</b></span>
  </header>
  <nav>
    <button data-t="rules" class="act">转发规则</button>
    <button data-t="clients">客户端</button>
    <button data-t="settings">设置</button>
    <button data-t="logs">日志</button>
  </nav>
  <main>
    <section id="tab-rules">
      <div class="row"><button class="pri" onclick="openRule()">＋ 新建规则</button>
        <span class="hint">速率面板每 2 秒刷新一次</span></div>
      <div class="card"><table>
        <thead><tr><th>状态</th><th>名称</th><th>协议</th><th class="num">监听端口</th><th>方向</th><th>目标</th>
          <th class="num col-rate">速率 ↑/↓</th><th class="num col-total">累计 ↑/↓</th><th class="num">连接</th><th></th></tr></thead>
        <tbody id="rules"></tbody></table></div>
    </section>
    <section id="tab-clients" hidden>
      <div class="row"><button class="pri" onclick="openClient()">＋ 添加客户端</button>
        <span class="hint">把 token 填进内网机 client.json 即可接入</span></div>
      <div class="card"><table>
        <thead><tr><th>状态</th><th>名称</th><th>Token</th><th>备注</th><th>来源地址</th><th>上线时间</th><th></th></tr></thead>
        <tbody id="clients"></tbody></table></div>
    </section>
    <section id="tab-settings" hidden>
      <div class="card"><h3>面板 IP 白名单</h3>
        <p class="hint">每行一个 IP 或 CIDR，如 192.168.1.0/24。在线客户端的来源 IP 始终自动放行；<b>留空时仅允许本机回环访问</b>。</p>
        <textarea id="wl" rows="5" style="width:100%"></textarea>
        <div class="row" style="margin-top:10px"><button class="pri" onclick="saveWL()">保存白名单</button></div>
      </div>
      <div class="card"><h3>修改面板密码</h3>
        <div class="row"><input id="npw" type="password" placeholder="新密码" style="width:220px">
        <button class="pri" onclick="savePW()">修改密码</button></div>
      </div>
    </section>
    <section id="tab-logs" hidden><div id="logpre">（空）</div></section>
  </main>
</div>

<dialog id="dlgRule"><h3 id="dlgRuleTitle">新建规则</h3>
  <label>名称</label><input id="f-name" placeholder="web">
  <label>协议</label><select id="f-proto"><option value="tcp">TCP</option><option value="udp">UDP</option></select>
  <label id="f-listen-label">监听端口（在服务器上开放）</label><input id="f-listen" type="number" min="1" max="65535">
  <label>方向</label><select id="f-client"></select>
  <label>目标地址（正向/反向以服务器视角解析；穿透以客户端视角解析）</label><input id="f-target" placeholder="127.0.0.1:80">
  <div class="acts"><button onclick="dlgRule.close()">取消</button><button class="pri" onclick="saveRule()">保存</button></div>
</dialog>

<dialog id="dlgClient"><h3>添加客户端</h3>
  <label>名称</label><input id="c-name" placeholder="office-pc">
  <label>备注</label><input id="c-note" placeholder="可选">
  <div class="acts"><button onclick="dlgClient.close()">取消</button><button class="pri" onclick="saveClient()">保存</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='rules', lastRules={}, lastT=0, editingId=null;

const BASE=location.pathname.replace(/\/+$/,''); // 兼容随机路径前缀
// 前端错误回传到面板日志，便于远程排查浏览器差异
const reportErr=n=>{try{fetch(BASE+'/api/client-error',{method:'POST',keepalive:true,
  headers:{'Content-Type':'application/json'},body:JSON.stringify(n)});}catch(e){}};
addEventListener('error',e=>reportErr({msg:String(e.message),src:e.filename,line:e.lineno}));
addEventListener('unhandledrejection',e=>reportErr({msg:String(e.reason&&e.reason.message||e.reason)}));
async function api(path,opts={}){
  const r=await fetch(BASE+path,Object.assign({headers:{'Content-Type':'application/json'},credentials:'same-origin'},opts));
  const body=await r.json().catch(()=>({}));
  if(r.status===401){
    if(path!=='/api/login')showLogin(); // 登录页自身 401 留在原地把原因显示出来
    throw new Error(body.error||'未登录');
  }
  if(!r.ok)throw new Error(body.error||r.status);
  return body;
}
function showLogin(){$('#login').hidden=false;$('#app').hidden=true;}
async function doLogin(){
  $('#loginErr').textContent='';
  try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});
    $('#pw').value='';$('#login').hidden=true;$('#app').hidden=false;refresh();}
  catch(e){$('#loginErr').textContent=e.message;}
}
function fmtB(n){if(n<1024)return n+' B';const u=['KB','MB','GB','TB'];let i=-1;do{n/=1024;i++}while(n>=1024&&i<3);return n.toFixed(n>=100?0:1)+' '+u[i];}
function fmtR(n){return n>=1024?fmtB(n)+'/s':(n||0).toFixed(0)+' B/s';}

// 点击弹窗 backdrop（空白处）关闭
for(const d of [dlgRule,dlgClient]) d.addEventListener('click',e=>{if(e.target===d)d.close();});

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('act',x===b));
  document.querySelectorAll('main section').forEach(s=>s.hidden=s.id!=='tab-'+tab);
  if(tab==='settings')loadWL();
});

/* ---- 规则 ---- */
async function refresh(){
  try{
    const [ov,rl,cl]=await Promise.all([api('/api/overview'),api('/api/rules'),api('/api/clients')]);
    document.querySelector('#tab-settings .card:last-child').hidden=!!ov.no_auth; // 免密模式隐藏改密码卡片
    $('#ov-uptime').textContent=ov.uptime;
    $('#ov-clients').textContent=cl.filter(c=>c.online).length+'/'+cl.length;
    $('#ov-rules').textContent=rl.length;
    const now=performance.now(), rates={};
    for(const r of rl){
      const p=lastRules[r.id];
      if(p){const dt=(now-lastT)/1000;
        rates[r.id]=[(r.bytes_in-p.i)/dt,(r.bytes_out-p.o)/dt];}
      lastRules[r.id]={i:r.bytes_in,o:r.bytes_out};
    }
    lastT=now;
    // 按客户端分组：正向规则归入「服务器」，其余按所属 client 分组
    const groups=new Map([['🚢 服务器',[]]]);
    for(const r of rl){
      const key=r.client?('💻 '+r.client+(r.side==='client'?'（反向）':'')):'🚢 服务器';
      if(!groups.has(key))groups.set(key,[]);
      groups.get(key).push(r);
    }
    let html='';
    for(const [g,rows] of groups){
      html+=`<tr class="grp"><td colspan="10">${esc(g)} · ${rows.length} 条</td></tr>`;
      for(const r of rows){
        const rt=rates[r.id]||[0,0];
        const dir=r.side==='client'?'反向（client 端口 → 服务器侧目标）'
                 :(r.client?`穿透（server 端口 → ${esc(r.client)} 内网）`:'正向（server 端口 → 任意目标）');
        html+=`<tr>
        <td><span class="badge ${r.enabled?'on':'off'}">${r.enabled?'运行':'停止'}</span>${r.note?`<div class="note">${esc(r.note)}</div>`:''}</td>
        <td>${esc(r.name)}</td><td>${r.proto.toUpperCase()}</td>
        <td class="num">${r.listen}</td><td>${dir}</td><td class="tok">${esc(r.target)}</td>
        <td class="num col-rate">${fmtR(rt[0])} / ${fmtR(rt[1])}</td>
        <td class="num col-total">${fmtB(r.bytes_in)} / ${fmtB(r.bytes_out)}</td>
        <td class="num">${r.conns}</td>
        <td style="white-space:nowrap">
          <button class="mini" onclick="editRule('${r.id}')">编辑</button>
          <button class="mini" onclick="toggleRule('${r.id}',${!r.enabled})">${r.enabled?'停用':'启用'}</button>
          <button class="mini danger" onclick="delRule('${r.id}','${esc(r.name)}')">删除</button></td></tr>`;
      }
    }
    $('#rules').innerHTML=html||'<tr><td colspan="10" class="muted">暂无规则，点击右上角新建</td></tr>';
    $('#clients').innerHTML=cl.map(c=>`<tr>
      <td><span class="badge ${c.online?'on':'off'}">${c.online?'在线':'离线'}</span></td>
      <td>${esc(c.name)}</td>
      <td class="tok"><span class="muted">${c.token.slice(0,6)}…</span> <button class="mini" onclick="copyTok(this,'${c.token}')">复制</button></td>
      <td>${esc(c.note)}</td><td>${esc(c.addr||'-')}</td><td>${esc(c.since||'-')}</td>
      <td><button class="mini danger" onclick="delClient('${esc(c.name)}')">删除</button></td></tr>`).join('')
      ||'<tr><td colspan="7" class="muted">暂无客户端</td></tr>';
    $('#f-client').innerHTML='<option value="s:">正向 — 服务器端口 → 任意目标</option>'+
      cl.map(c=>`<option value="s:${esc(c.name)}">穿透 — 服务器端口 → ${esc(c.name)} 内网目标</option>`).join('')+
      cl.map(c=>`<option value="c:${esc(c.name)}">反向 — ${esc(c.name)} 端口 → 服务器侧目标</option>`).join('');
  }catch(e){/* 401 已跳登录 */}
}
function copyTok(btn,tok){navigator.clipboard.writeText(tok);btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',1200);}

function openRule(id){
  editingId=id||null;
  $('#dlgRuleTitle').textContent=id?'编辑规则':'新建规则';
  $('#f-name').value='';$('#f-proto').value='tcp';$('#f-listen').value='';$('#f-target').value='';
  if(id){api('/api/rules').then(rl=>{const x=rl.find(v=>v.id===id);if(!x)return;
      $('#f-name').value=x.name;$('#f-proto').value=x.proto;$('#f-listen').value=x.listen;
      $('#f-target').value=x.target;
      $('#f-client').value=(x.side==='client'?'c:':'s:')+(x.client||'');syncListenLabel();});}
  else {$('#f-client').value='s:';syncListenLabel();}
  dlgRule.showModal();
}
const editRule=openRule;
// 监听端口位置跟随方向：正向/穿透在服务器，反向在客户端本机
function syncListenLabel(){
  const side=($('#f-client').value||'s:').split(':')[0];
  $('#f-listen-label').textContent=side==='c'?'监听端口（在客户端本机开放）':'监听端口（在服务器上开放）';
}
$('#f-client').addEventListener('change',syncListenLabel);
function saveRule(){
  const [dir,client]=($('#f-client').value||'s:').split(':');
  const body={name:$('#f-name').value.trim(),proto:$('#f-proto').value,
    side:dir==='c'?'client':'server',client:client,
    listen:+$('#f-listen').value||0,target:$('#f-target').value.trim()};
  const p=editingId?api('/api/rules/'+editingId,{method:'PUT',body:JSON.stringify(body)})
                   :api('/api/rules',{method:'POST',body:JSON.stringify(body)});
  p.then(()=>{dlgRule.close();refresh();}).catch(e=>alert(e.message));
}
function toggleRule(id,on){api('/api/rules/'+id+'/toggle',{method:'POST',body:JSON.stringify({enabled:on})}).then(refresh).catch(e=>alert(e.message));}
function delRule(id,name){if(confirm('删除规则「'+name+'」？'))api('/api/rules/'+id,{method:'DELETE'}).then(refresh).catch(e=>alert(e.message));}

/* ---- 客户端 ---- */
function openClient(){$('#c-name').value='';$('#c-note').value='';dlgClient.showModal();}
function saveClient(){api('/api/clients',{method:'POST',body:JSON.stringify({name:$('#c-name').value.trim(),note:$('#c-note').value.trim()})})
  .then(()=>{dlgClient.close();refresh();}).catch(e=>alert(e.message));}
function delClient(name){if(confirm('删除客户端「'+name+'」？'))api('/api/clients/'+encodeURIComponent(name),{method:'DELETE'}).then(refresh).catch(e=>alert(e.message));}

/* ---- 设置 ---- */
async function loadWL(){try{const w=await api('/api/whitelist');$('#wl').value=w.entries.join('\n');}catch(e){}}
function saveWL(){api('/api/whitelist',{method:'PUT',body:JSON.stringify({entries:$('#wl').value.split('\n').map(s=>s.trim()).filter(Boolean)})})
  .then(()=>alert('已保存')).catch(e=>alert(e.message));}
function savePW(){const p=$('#npw').value;if(!p)return alert('密码不能为空');
  api('/api/password',{method:'PUT',body:JSON.stringify({password:p})}).then(()=>{alert('已修改，下次登录用新密码');$('#npw').value='';}).catch(e=>alert(e.message));}

/* ---- 日志 ---- */
async function pollLogs(){
  if(tab!=='logs')return;
  try{const l=await api('/api/logs?n=300');
    const pre=$('#logpre');const atBottom=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-30;
    pre.textContent=l.lines.join('\n')||'（空）';
    if(atBottom)pre.scrollTop=pre.scrollHeight;
  }catch(e){}
}

// 启动：先探登录态——已登录（或免密）直接进面板；否则显示登录页
api('/api/me').then(()=>{$('#login').hidden=true;$('#app').hidden=false;refresh();})
               .catch(()=>showLogin());
setInterval(refresh,2000);
setInterval(pollLogs,2000);
</script>
</body>
</html>
